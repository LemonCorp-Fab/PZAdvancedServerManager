name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore PZAdvancedServerManager.sln
      - run: dotnet test PZAdvancedServerManager.sln -c Release --no-restore
      - name: Publish standalone Windows build
        run: dotnet publish src/PZAdvancedServerManager.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: PZAdvancedServerManager-win-x64
          path: publish/win-x64/
